[mod-name]
analog-remote-view=Analog Remote View

[mod-description]
analog-remote-view=Transforms Remote View into an old-school surveillance / CRT terminal overlay. GUI overlays only — does not modify the rendering pipeline.

[mod-setting-name]
rvc-enable=Enable Analog Remote View
rvc-default-preset=Default preset
rvc-remote-view-only=Remote View only (default)
rvc-master-intensity=Master intensity
rvc-debug=Debug mode

[mod-setting-description]
rvc-enable=Master switch for this mod's overlays.
rvc-default-preset=Preset applied for new players / until changed in the settings window.
rvc-remote-view-only=When enabled (default), overlays appear only in Remote View. Disable Global Overlay in the in-game settings for the same effect per-session.
rvc-master-intensity=Scales overall effect strength (0 = invisible, 1 = normal).
rvc-debug=Show an on-screen debug panel while the overlay is active.

[string-mod-setting]
rvc-default-preset-classic_crt=Classic CRT
rvc-default-preset-pipboy=Terminal Green
rvc-default-preset-vhs=VHS
rvc-default-preset-military=Military Terminal
rvc-default-preset-scifi=Sci-Fi Surveillance
rvc-default-preset-mono_green=Monochrome Green
rvc-default-preset-mono_amber=Monochrome Amber
rvc-default-preset-clean=Clean / Off

[controls]
rvc-toggle-settings=Toggle Analog Remote View settings

[shortcut-name]
rvc-toggle-settings=Analog Remote View settings

